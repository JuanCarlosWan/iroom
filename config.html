<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Configuracion del index</title>
        <link href="css/iroom.css" rel="stylesheet">
        <script src="script.js"></script>
        
    </head>
    <body>
        <header>
            <h1>Configuración de la habitación</h1>
        </header>
        <main>
            <form id="form-config">
    <fieldset>    
        <legend>Datos de la Habitación</legend>
        
        <div class="form-grid">
            <div class="form-group">
                <label for="pais">País</label>
                <input type="text" id="pais" name="pais" list="listaPaises">
                <datalist id="listaPaises">
                    <option value="España">
                    <option value="Francia">
                    <option value="Portugal">
                    <option value="Italia">
                    <option value="Alemania">
                    <option value="Paises Bajos">  
                </datalist>
            </div>

            <div class="form-group">
                <label for="ciudad">Ciudad</label>
                <input type="text" id="ciudad" name="ciudad">
            </div>

            <div class="form-group">
                <label for="coord">Coordenadas GPS</label>
                <input type="text" id="coord" name="coord" placeholder="Ej: 40.513, -3.3486">
            </div>

            <div class="form-group">
                <label for="gps">Mapa URL</label>
                <input type="text" id="gps" name="gps" placeholder="Se genera automáticamente">
            </div>

            <div class="form-group">
                <label for="foto">Foto</label>
                <input type="file" id="foto" name="foto">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password">
                <div id="indicadorPassword">Evaluación de longitud: Sin introducir</div>
            </div>
        </div>
    </fieldset>

    <fieldset>
        <legend>Sensores de la Habitación</legend>
        
        <div class="form-grid">
            <div class="form-group">
                <label for="tempActual">Temperatura Actual (°C)</label>
                <input type="text" id="tempActual" name="tempActual" placeholder="Ej: 24">
            </div>
            
            <div class="form-group">
                <label for="temp-max">Temperatura Máxima</label>
                <input type="number" id="temp-max" name="temp-max" min="-20" max="45">
            </div>

            <div class="form-group">
                <label for="temp-min">Temperatura Mínima</label>
                <input type="number" id="temp-min" name="temp-min" min="-20" max="45">
            </div>
        </div>

        <div class="checkbox-group">
            <strong>Sensores activos:</strong>
            <label><input type="checkbox" id="humedad" name="sensor" value="humedad"> Humedad</label>    
            <label><input type="checkbox" id="nsonido" name="sensor" value="nsonido"> Nivel de Sonido</label>    
            <label><input type="checkbox" id="nluz" name="sensor" value="nluz"> Nivel de Luz</label>    
            <label><input type="checkbox" id="mov" name="sensor" value="mov"> Movimiento</label>    
        </div>
        
        <div style="margin-top: 15px; font-weight: bold;">
            <output id="diferencia" for="temp-max temp-min"></output>
        </div>
            </fieldset>

                <div class="form-actions">
                    <input type="submit" value="Enviar datos" style="padding: 10px 20px; cursor: pointer;">
                    <a href="index.html">Volver a inicio</a>    
                </div>
            </form>
        </main>
        <footer>

        </footer>
    </body>
</html>
