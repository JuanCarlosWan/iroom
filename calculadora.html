<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de Temperaturas - Smart Room</title>
    <link rel="stylesheet" href="css/iroom.css">
</head>
<body>
    <header>
        <h1>Calculadora de Temperaturas</h1>
    </header>
    <nav>
            <ul>
                <li><a href="index.html">Volver a inicio</a></li>
                <li>
                    <a href="minombre.html">Nombre</a>
                </li>
                <li><a href="calculadora.html">Calculadora</a></li>
            </ul>
        </nav>
    <main>
        <section style="max-width: 320px; margin: 20px auto; text-align: center;">
            <h2>Calculadora</h2>
            <!-- Hueco de resultados que muestra el valor + la escala (°C, K, °F) -->
            <input type="text" id="pantalla-calc" value="0 °C" readonly 
                   style="width: 90%; font-size: 1.4rem; text-align: right; margin-bottom: 10px; padding: 8px;">

            <!-- Botonera numérica y operaciones básicas -->
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px;">
                <button type="button" onclick="pulsarBotonCalc('7')">7</button>
                <button type="button" onclick="pulsarBotonCalc('8')">8</button>
                <button type="button" onclick="pulsarBotonCalc('9')">9</button>
                <button type="button" onclick="pulsarBotonCalc('/')">/</button>

                <button type="button" onclick="pulsarBotonCalc('4')">4</button>
                <button type="button" onclick="pulsarBotonCalc('5')">5</button>
                <button type="button" onclick="pulsarBotonCalc('6')">6</button>
                <button type="button" onclick="pulsarBotonCalc('*')">*</button>

                <button type="button" onclick="pulsarBotonCalc('1')">1</button>
                <button type="button" onclick="pulsarBotonCalc('2')">2</button>
                <button type="button" onclick="pulsarBotonCalc('3')">3</button>
                <button type="button" onclick="pulsarBotonCalc('-')">-</button>

                <button type="button" onclick="pulsarBotonCalc('0')">0</button>
                <button type="button" onclick="pulsarBotonCalc('.')">.</button>
                <button type="button" onclick="limpiarPantallaCalc()">C</button>
                <button type="button" onclick="pulsarBotonCalc('+')">+</button>
            </div>

            <button type="button" onclick="calcularResultadoCalc()" style="width: 100%; padding: 10px; margin-bottom: 15px; font-weight: bold;">
                = Calcular
            </button>

            <!-- Conversión directa entre escalas -->
            <h3>Convertir resultado a escala:</h3>
            <div style="display: flex; gap: 8px; justify-content: center;">
                <button type="button" onclick="convertirEscalaCalc('C')">Celsius (°C)</button>
                <button type="button" onclick="convertirEscalaCalc('K')">Kelvin (K)</button>
                <button type="button" onclick="convertirEscalaCalc('F')">Fahrenheit (°F)</button>
            </div>
        </section>
    </main>
    <footer>
        <p>Universidad de Alcalá</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
